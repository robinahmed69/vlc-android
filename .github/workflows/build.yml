name: Build Wave Player

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      ANDROID_SDK: /usr/local/lib/android/sdk
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/21.4.7075529
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y automake ant autopoint cmake build-essential libtool \
            patch pkg-config protobuf-compiler ragel subversion unzip git \
            wget python3

      - name: Install NDK
        run: |
          yes | $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_SDK" > local.properties
          echo "android.ndkPath=$ANDROID_NDK" >> local.properties

      - name: Build
        run: |
          chmod +x buildsystem/compile.sh gradlew
          ./buildsystem/compile.sh -l -a arm64-v8a -r

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wave-Player-APK
          path: "**/*.apk"
