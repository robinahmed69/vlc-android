name: Build Wave Player

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      ANDROID_SDK: /usr/local/lib/android/sdk
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/28.2.13676358
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y automake autoconf ant autopoint cmake build-essential libtool libtool-bin \
            patch pkg-config protobuf-compiler ragel subversion unzip git \
            wget python3 python3-pip gperf gettext meson ninja-build \
            yasm nasm flex bison m4 libxml2-utils

      - name: Install NDK
        run: |
          yes | $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"

      - name: Set git identity
        run: |
          git config --global user.email "wave@example.com"
          git config --global user.name "Wave Builder"

      - name: Cache libvlc build
        uses: actions/cache@v4
        with:
          path: |
            libvlcjni
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: vlc-v1-${{ runner.os }}-${{ hashFiles('buildsystem/compile.sh') }}
          restore-keys: |
            vlc-v1-${{ runner.os }}-

      - name: Build
        run: |
          chmod +x buildsystem/compile.sh
          mkdir -p $HOME/.android
          [ -f $HOME/.android/debug.keystore ] || keytool -genkey -v -keystore $HOME/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          ./buildsystem/compile.sh -a arm64-v8a -t

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wave-Player-APK
          path: "**/*.apk"
