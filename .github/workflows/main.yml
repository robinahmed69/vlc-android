name: Build Wave Player

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y automake ant autopoint cmake build-essential libtool \
            patch pkg-config protobuf-compiler ragel subversion unzip git openjdk-17-jre-headless \
            wget python3

      - name: Install NDK
        run: |
          yes | sdkmanager "ndk;21.4.7075529" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.ndkPath=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties

      - name: Build
        run: |
          chmod +x buildsystem/compile.sh gradlew
          ./buildsystem/compile.sh -l -a arm64-v8a -r

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wave-Player-APK
          path: "**/*.apk"
